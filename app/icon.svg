<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Notes</title>

  <!--
    Favicon, in the app's neo-brutalist language: flat spot colour, pure black,
    hard 90-degree corners, no gradient.

    Hex literals are unavoidable here and do NOT break the "no bare hex" rule in
    AGENTS.md — that rule is about components, and a standalone SVG asset cannot
    read the @theme tokens. The values are copied from app/globals.css:
      #FFE500 --color-yellow   #000000 --color-ink

    Drawn for 16x16 above all else: at that size anything thinner than about
    3 units of this 64-unit viewBox disappears, so it is three heavy bars on a
    full-bleed field and nothing more. The bars are square, not rounded, and the
    last is short — the universal shape for a written note.
  -->

  <rect width="64" height="64" fill="#FFE500"/>

  <!-- Border drawn as a stroked rect inset by half its width, so it sits fully
       inside the viewBox and never gets clipped. Gives the icon an edge on a
       light tab bar, where yellow alone would bleed into the background. -->
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#000000" stroke-width="6"/>

  <g fill="#000000">
    <rect x="15" y="19" width="34" height="6"/>
    <rect x="15" y="29" width="34" height="6"/>
    <rect x="15" y="39" width="20" height="6"/>
  </g>
</svg>
