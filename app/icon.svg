<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bucket list">
  <defs>
    <linearGradient id="blush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9e4"/>
      <stop offset="100%" stop-color="#f2789f"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#blush)"/>

  <!-- checklist lines -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.92">
    <path d="M28 24h16"/>
    <path d="M28 34h16"/>
    <path d="M28 44h10"/>
  </g>

  <!-- ticks -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 23.5l3 3 5-6"/>
    <path d="M18 33.5l3 3 5-6"/>
  </g>

  <!-- the last one is still a heart, not a tick -->
  <path d="M21.6 41.4c-1.9-1.8-5-1.5-6.4.8-1.1 1.8-.6 4.1 1 5.5l4.8 4.2a.9.9 0 0 0 1.2 0l4.8-4.2c1.6-1.4 2.1-3.7 1-5.5-1.4-2.3-4.5-2.6-6.4-.8z" fill="#ffffff"/>
</svg>
